<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroFlo — ATC Operations &amp; Resilience Support (JFK · LGA · EWR)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#05070b;--panel:rgba(17,21,28,.80);--line:rgba(255,255,255,.07);--text:#eef2f7;--mut:#8a96a8;--dim:#5b667a;--chip:#0f131b;--chipl:#283142;--act:#1c2330;
--ok:#3ddc97;--watch:#f5b942;--warn:#ff8a3d;--crit:#ff4d5e;--info:#5aa9ff;--sim:#b18cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 Geist,ui-sans-serif,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer}
#brand{position:fixed;left:18px;top:14px;z-index:5;pointer-events:none}
#brand .logo{font-weight:700;letter-spacing:.18em;font-size:13px}
#brand .sub{color:var(--mut);font-size:11px;margin-top:1px}
.pill{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3)}
.pill button{background:none;border:0;border-radius:10px;padding:7px 13px;font-size:12px;color:var(--mut);position:relative;white-space:nowrap}
.pill button:hover{color:var(--text)}
.pill button.on{background:var(--act);color:var(--text)}
.bell{display:none;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;vertical-align:1px}
.bell.show{display:inline-block}
.bell.w{background:var(--warn)}.bell.i{background:var(--info)}
#topr{position:fixed;right:16px;top:14px;z-index:5;display:flex;gap:8px;align-items:center}
.chip{padding:5px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:11px;color:var(--mut);white-space:nowrap}
.chip.adv{color:var(--watch);border-color:rgba(245,185,66,.25);letter-spacing:.04em}
.chip b{color:var(--text);font-weight:500}
.chip.on{color:var(--text);border-color:rgba(255,138,61,.4)}
main{position:fixed;inset:0;pointer-events:none;z-index:3}
.view{display:none;position:absolute;inset:0}
.view.on{display:block}
.panel{position:absolute;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px) saturate(1.3);padding:14px 15px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3345 transparent}
.panel.L{left:16px;top:58px;bottom:96px;width:318px}
.panel.R{right:16px;top:58px;bottom:96px;width:352px}
.grid{padding:58px 16px 96px}
.grid .panel{position:relative;inset:auto}
.view.grid.on{display:grid;gap:12px}
.lab{grid-template-columns:340px 1fr}
.deg{grid-template-columns:1.15fr 1fr .95fr;grid-template-rows:auto minmax(0,1fr)}
#degMat td{padding:2px 6px}#degMat .cell{padding:2px 6px}
#nlSel,#sfcL>div,#sfcR>div{margin-bottom:16px}
.deg #degMat{grid-column:1/4}
.alr{grid-template-columns:1.05fr 1.1fr .8fr}
#tl{left:16px;right:16px;bottom:14px;height:70px;display:flex;align-items:center;gap:14px;padding:8px 14px;z-index:5;overflow:hidden}
.tlc{display:flex;align-items:center;gap:8px;flex:none}
.tlm{flex:1;height:100%;position:relative;min-width:0}
.tlm canvas{width:100%;height:100%;display:block;cursor:pointer}
.tlr{flex:none;font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:2px;min-width:132px}
.ic{background:var(--chip);border:1px solid var(--chipl);border-radius:9px;width:30px;height:30px;font-size:12px}
.spd{display:flex;background:var(--chip);border:1px solid var(--chipl);border-radius:9px;padding:2px}
.spd button{background:none;border:0;border-radius:7px;padding:4px 8px;font-size:11px;color:var(--mut)}
.spd button.on{background:var(--act);color:var(--text)}
#clock{font-size:12px;min-width:92px;color:var(--text)}
h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:8px}
h3 .sp{flex:1}
h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
h4{margin:0 0 4px;font-size:13px;font-weight:600}
.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
.sub2{color:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv>div{background:var(--chip);border:1px solid var(--chipl);border-radius:11px;padding:7px 10px}
.kv label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kv b{font-size:16px;font-weight:600;font-family:'Geist Mono',monospace}
.kv small{color:var(--mut);font-size:11px;font-weight:400}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.grow{flex:1}
.btn{background:var(--chip);border:1px solid var(--chipl);border-radius:10px;padding:6px 11px;font-size:12px;color:var(--text)}
.btn:hover{border-color:#3a475f;background:#141a24}
.btn.pri{background:#1c3556;border-color:#2f5a93}
.btn.pri:hover{background:#21406a}
.btn.sm{padding:3px 8px;font-size:11px;border-radius:8px}
.btn.dng:hover{border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.45;cursor:default}
.tog{display:flex;flex-wrap:wrap;gap:5px}
.tog button{background:var(--chip);border:1px solid var(--chipl);border-radius:9px;padding:4px 9px;font-size:11.5px;color:var(--mut)}
.tog button.on{background:var(--act);color:var(--text);border-color:#3a475f}
input,select,textarea{font:inherit;color:var(--text);background:var(--chip);border:1px solid var(--chipl);border-radius:9px;padding:5px 8px;min-width:0}
input[type=range]{padding:0;accent-color:#5aa9ff;height:18px}
input[type=checkbox]{accent-color:#5aa9ff}
input[type=number]{width:68px}
textarea{width:100%;min-height:150px;font-family:'Geist Mono',monospace;font-size:11px}
select{max-width:100%}
.tag{display:inline-block;font:500 9.5px/1 'Geist Mono',monospace;letter-spacing:.05em;padding:3px 5px;border-radius:5px;border:1px solid;vertical-align:1px}
.tag.PUBLIC{color:#7fb8ff;border-color:rgba(90,169,255,.35)}
.tag.SYNTHETIC{color:#9aa6b8;border-color:rgba(138,150,168,.35)}
.tag.ESTIMATED{color:#f5b942;border-color:rgba(245,185,66,.35)}
.tag.SIMULATED{color:#b18cff;border-color:rgba(177,140,255,.4)}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.sev.ok,.s-ok{background:var(--ok)}.sev.info{background:var(--info)}.sev.watch{background:var(--watch)}.sev.warning{background:var(--warn)}.sev.critical{background:var(--crit)}
.bar{height:6px;border-radius:3px;background:#1a2130;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--info)}
.bar.ok>i{background:var(--ok)}.bar.watch>i{background:var(--watch)}.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
.list{display:flex;flex-direction:column;gap:6px}
.card{background:var(--chip);border:1px solid var(--chipl);border-radius:12px;padding:9px 11px}
.card.sel{border-color:#3d6fb0}
.card.crit{border-color:rgba(255,77,94,.45)}.card.warn{border-color:rgba(255,138,61,.4)}
.muted{color:var(--mut)}.dim{color:var(--dim)}
.up{color:var(--crit)}.down{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:500;color:var(--mut);text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
td.mono,th.mono{font-family:'Geist Mono',monospace;font-size:11.5px}
tr.bad td{background:rgba(255,77,94,.07)}
.cell{border-radius:7px;padding:4px 6px;text-align:center;font:500 10.5px/1.2 'Geist Mono',monospace;border:1px solid var(--line);white-space:nowrap}
.cell.ok{color:var(--ok);background:rgba(61,220,151,.06)}
.cell.degraded{color:var(--watch);background:rgba(245,185,66,.1);border-color:rgba(245,185,66,.3)}
.cell.lost{color:var(--crit);background:rgba(255,77,94,.12);border-color:rgba(255,77,94,.4)}
.cell.restoring{color:var(--info);background:rgba(90,169,255,.1);border-color:rgba(90,169,255,.35)}
.pillst{font:500 10px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:6px;border:1px solid var(--chipl);color:var(--mut)}
.pillst.avail{color:var(--ok);border-color:rgba(61,220,151,.4)}.pillst.limited{color:var(--watch);border-color:rgba(245,185,66,.4)}.pillst.unavail{color:var(--crit);border-color:rgba(255,77,94,.45)}
.pillst.open{color:var(--info);border-color:rgba(90,169,255,.4)}.pillst.prog{color:var(--watch);border-color:rgba(245,185,66,.4)}.pillst.done{color:var(--ok);border-color:rgba(61,220,151,.4)}.pillst.blocked{color:var(--crit);border-color:rgba(255,77,94,.4)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,4,8,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;pointer-events:auto}
.modal.on{display:flex}
.modal .box{width:min(640px,94vw);max-height:88vh;overflow:auto;background:#0d1118;border:1px solid var(--chipl);border-radius:18px;padding:18px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field>label{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.field .rv{display:flex;gap:8px;align-items:center}
.field .rv input[type=range]{flex:1}
.effrow{display:grid;grid-template-columns:1.1fr 1fr 1fr 70px 70px 26px;gap:6px;align-items:center;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{from{background:rgba(90,169,255,.25)}to{background:transparent}}
.empty{color:var(--dim);font-size:12px;padding:8px 2px}
.note{font-size:11.5px;color:var(--mut);border-left:2px solid var(--chipl);padding:2px 0 2px 9px;margin:6px 0}
@media (max-width:1100px){.panel.L{width:270px}.panel.R{width:290px}.pill button{padding:7px 8px}#advisory{display:none}.lab{grid-template-columns:290px 1fr}}
@media (max-width:820px){.grid{overflow:auto;display:block!important}.view.grid:not(.on){display:none!important}.grid .panel{margin-bottom:10px;max-height:none}#brand{display:none}.panel.R{display:none}}

#scenChip{max-width:30vw;overflow:hidden;text-overflow:ellipsis}
#guide{cursor:pointer}
#guide:hover{color:var(--text)}
.wxkey2{display:flex;flex-direction:column;gap:5px;margin:8px 0 2px;font-size:10.5px;color:var(--mut);line-height:1.35}
.wxkey2>div{display:flex;gap:8px;align-items:flex-start}
.wxkey2 i{flex:none;width:22px;height:12px;margin-top:2px;display:inline-block;border-radius:4px}
.wxkey2 i.hz{background:linear-gradient(90deg,#46c86e,#ebd746,#ff8c32,#f03c46);opacity:.75}
.wxkey2 i.fr{height:0;border-top:2px dashed rgba(235,235,225,.85);margin-top:8px}
.wxkey2 i.rg{width:12px;height:12px;border-radius:50%;border:2px solid #5aa9ff;margin:2px 5px 0 5px}

.zoomc{position:fixed;right:384px;bottom:110px;z-index:6;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
.zoomc button{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:18px;line-height:1;color:var(--text)}
.zoomc button:hover{background:var(--act)}
@media (max-width:1100px){.zoomc{right:322px}}
@media (max-width:820px){.zoomc{right:16px}}
.wxkey2 i.cl{background:linear-gradient(90deg,rgba(214,221,232,.1),rgba(214,221,232,.6))}
.wxkey2 i.wd{height:0;border-top:2px solid rgba(250,235,175,.8);margin-top:8px}
.wxkey2 i.st{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,90,110,.8);margin:2px 5px 0 5px}
.wxkey2 i.xa{height:0;border-top:2px solid #f5b942;margin-top:8px}
body.preview-mode{background:#05070b;overflow:hidden}
body.preview-mode #brand,body.preview-mode #nav,body.preview-mode #topr,body.preview-mode main,body.preview-mode #zoomc,body.preview-mode #tl,body.preview-mode #modal{display:none!important}
body.preview-mode #cv{cursor:grab}

/* Embedded in the AeroFlo portal: the portal sidebar replaces the top bar. */
body.embedded #brand,body.embedded #nav,body.embedded #topr{display:none!important}
body.embedded .panel.L,body.embedded .panel.R{top:16px}
body.embedded .grid{padding-top:16px}

.focsw{position:fixed;top:14px;left:200px;z-index:6;display:inline-flex;gap:2px;padding:2px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:rgba(255,255,255,.04);pointer-events:auto}
.focsw button{font:600 11px 'Geist Mono',monospace;color:#9aa7bd;background:none;border:0;border-radius:7px;padding:4px 10px;cursor:pointer}
.focsw button.on{background:#5aa9ff;color:#06101e}
.focsw button:hover:not(.on){color:#fff}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="brand">
  <div class="logo">AeroFlo</div>
  <div class="sub">ATC operations &amp; resilience</div>
  <div id="focsw" class="focsw" title="Focus airport: drives the queue, runways, surface view, scenarios and alerts"><button data-f="JFK" class="on">JFK</button><button data-f="LGA">LGA</button><button data-f="EWR">EWR</button></div>
</div>
<nav id="nav" class="pill">
  <button data-view="net" class="on">Network</button>
  <button data-view="sfc">Airport Surface</button>
  <button data-view="lab">What-If Lab</button>
  <button data-view="deg">Degraded Ops</button>
  <button data-view="alr">Alerts &amp; Checks<span id="bell" class="bell"></span></button>
</nav>
<div id="topr">
  <div id="scenChip" class="chip"></div>
  <div id="advisory" class="chip adv" title="AeroFlo never issues clearances, directs aircraft or activates procedures.">ADVISORY ONLY</div>
  <button id="guide" class="chip">How it works</button>
</div>

<main>
  <section id="v-net" class="view on">
    <aside class="panel L" id="netL"></aside>
    <aside class="panel R" id="netR"></aside>
  </section>
  <section id="v-sfc" class="view">
    <aside class="panel L" id="sfcL"></aside>
    <aside class="panel R" id="sfcR"></aside>
  </section>
  <section id="v-lab" class="view grid lab">
    <aside class="panel" id="labLib"></aside>
    <aside class="panel" id="labMain"></aside>
  </section>
  <section id="v-deg" class="view grid deg">
    <aside class="panel" id="degMat"></aside>
    <aside class="panel" id="degCap"></aside>
    <aside class="panel" id="degTask"></aside>
    <aside class="panel" id="degRec"></aside>
  </section>
  <section id="v-alr" class="view grid alr">
    <aside class="panel" id="alrFeed"></aside>
    <aside class="panel" id="alrLedger"></aside>
    <aside class="panel" id="alrLog"></aside>
  </section>
</main>

<div id="zoomc" class="zoomc"><button data-z="in" title="Zoom in (+ or double-click)">+</button><button data-z="out" title="Zoom out (− or shift + double-click)">−</button><button data-z="fit" title="Fit US (0)">⤢</button></div>

<footer id="tl" class="panel">
  <div class="tlc">
    <button id="bPlay" class="ic" title="Play / pause">❚❚</button>
    <button id="bRestart" class="ic" title="Restart">↺</button>
    <div class="spd" id="spd" title="Multiples of real time"><button data-s="1">Real time</button><button data-s="10" class="on">10×</button><button data-s="60">60×</button><button data-s="300">300×</button></div>
    <div id="clock" class="mono"></div>
  </div>
  <div class="tlm"><canvas id="tlc"></canvas></div>
  <div class="tlr" id="tlLegend"></div>
</footer>
<div id="modal" class="modal"></div>

<script>'use strict';
/* ============================================================
   AIRSPACE — data layer
   Data classes used throughout the UI:
   PUBLIC     airport locations, runway designators, facility names
   SYNTHETIC  generated traffic, schedules, rotations
   ESTIMATED  queue/ETA/capacity predictions derived from the model
   SIMULATED  anything produced by a scenario (failures, weather)
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const COSLAT = Math.cos(38 * Math.PI / 180);
const lon2x = lon => (lon + 125) * COSLAT;
const lat2y = lat => 50 - lat;

// id, name, lon, lat, modeled hourly rate (each of arr/dep), traffic weight, ARTCC, TRACON
const AIRPORTS = [
  ['JFK', 'John F. Kennedy Intl', -73.78, 40.64, 44, 3, 'ZNY', 'N90'],
  ['LGA', 'LaGuardia', -73.87, 40.78, 40, 2, 'ZNY', 'N90'],
  ['EWR', 'Newark Liberty', -74.17, 40.69, 45, 2.5, 'ZNY', 'N90'],
  ['PHL', 'Philadelphia', -75.24, 39.87, 50, 2.2, 'ZNY', null],
  ['BOS', 'Boston Logan', -71.01, 42.36, 50, 2.7, 'ZBW', null],
  ['DCA', 'Reagan National', -77.04, 38.85, 35, 1.8, 'ZDC', null],
  ['IAD', 'Washington Dulles', -77.46, 38.95, 50, 1.8, 'ZDC', null],
  ['BWI', 'Baltimore/Washington', -76.67, 39.18, 40, 1.5, 'ZDC', null],
  ['PIT', 'Pittsburgh', -80.23, 40.49, 30, 1, 'ZOB', null],
  ['CLE', 'Cleveland Hopkins', -81.85, 41.41, 35, 1, 'ZOB', null],
  ['DTW', 'Detroit Metro', -83.35, 42.21, 60, 2.7, 'ZOB', null],
  ['ORD', "Chicago O'Hare", -87.90, 41.98, 100, 5, 'ZAU', null],
  ['MSP', 'Minneapolis–St Paul', -93.22, 44.88, 60, 2.7, 'ZMP', null],
  ['STL', 'St. Louis Lambert', -90.37, 38.75, 35, 1.2, 'ZKC', null],
  ['MCI', 'Kansas City Intl', -94.71, 39.30, 35, 1, 'ZKC', null],
  ['BNA', 'Nashville Intl', -86.68, 36.12, 40, 1.6, 'ZME', null],
  ['ATL', 'Atlanta Hartsfield-Jackson', -84.43, 33.64, 110, 6, 'ZTL', null],
  ['CLT', 'Charlotte Douglas', -80.94, 35.21, 70, 3.5, 'ZTL', null],
  ['MIA', 'Miami Intl', -80.29, 25.79, 55, 3, 'ZMA', null],
  ['MCO', 'Orlando Intl', -81.31, 28.43, 55, 3, 'ZJX', null],
  ['DFW', 'Dallas/Fort Worth', -97.04, 32.90, 100, 5, 'ZFW', null],
  ['IAH', 'Houston Intercontinental', -95.34, 29.98, 70, 3.3, 'ZHU', null],
  ['DEN', 'Denver Intl', -104.67, 39.86, 90, 4, 'ZDV', null],
  ['SLC', 'Salt Lake City', -111.98, 40.79, 55, 2, 'ZLC', null],
  ['PHX', 'Phoenix Sky Harbor', -112.01, 33.43, 60, 3, 'ZAB', null],
  ['LAS', 'Las Vegas Harry Reid', -115.15, 36.08, 60, 3, 'ZLA', null],
  ['LAX', 'Los Angeles Intl', -118.41, 33.94, 80, 4.5, 'ZLA', null],
  ['SFO', 'San Francisco Intl', -122.38, 37.62, 50, 3, 'ZOA', null],
  ['SEA', 'Seattle–Tacoma', -122.31, 47.45, 50, 3, 'ZSE', null],
  ['PDX', 'Portland Intl', -122.60, 45.59, 35, 1.3, 'ZSE', null],
].map(a => ({ id: a[0], name: a[1], lon: a[2], lat: a[3], cap: a[4], w: a[5], ctr: a[6], tracon: a[7], x: lon2x(a[2]), y: lat2y(a[3]) }));
const AP = Object.fromEntries(AIRPORTS.map(a => [a.id, a]));

const CENTERS = [
  ['ZBW', 'Boston Center', -71.5, 42.8], ['ZNY', 'New York Center', -74.5, 41.0], ['ZDC', 'Washington Center', -77.5, 38.8],
  ['ZOB', 'Cleveland Center', -81.5, 41.2], ['ZTL', 'Atlanta Center', -84.2, 33.5], ['ZMA', 'Miami Center', -80.8, 26.5],
  ['ZJX', 'Jacksonville Center', -82.0, 30.5], ['ZID', 'Indianapolis Center', -86.0, 39.5], ['ZAU', 'Chicago Center', -88.5, 41.8],

function pointInPoly(lon, lat, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
// ARTCC "sector" regions: nearest-centre cells clipped to the US outline (schematic)
const SECTOR_CELLS = (() => {
  const step = 0.5, cells = [], grid = {};
  for (let lon = -125; lon < -66; lon += step) for (let lat = 24; lat < 50; lat += step) {
    const cx = lon + step / 2, cy = lat + step / 2;
    if (!pointInPoly(cx, cy, US_POLY)) continue;
    let best = null, bd = 1e9;
    for (const c of CENTERS) { const d = ((cx - c.lon) * COSLAT) ** 2 + (cy - c.lat) ** 2; if (d < bd) { bd = d; best = c.id; } }
    const cell = { x: lon2x(lon), y: lat2y(lat + step), w: step * COSLAT, h: step, c: best, gx: Math.round((lon + 125) / step), gy: Math.round((lat - 24) / step) };
    cells.push(cell); grid[cell.gx + ',' + cell.gy] = cell;
  }
  const edges = [];
  for (const c of cells) {
    const r = grid[(c.gx + 1) + ',' + c.gy], u = grid[c.gx + ',' + (c.gy + 1)];
    if (!r || r.c !== c.c) edges.push([c.x + c.w, c.y, c.x + c.w, c.y + c.h]);
    if (!u || u.c !== c.c) edges.push([c.x, c.y, c.x + c.w, c.y]);
  }
  return { cells, edges };
})();

  else if (t.dataset.n) { const inst = S.cfg.stack.find(s => s.uid === +t.dataset.uid); if (inst) { inst[t.dataset.n] = +t.value; evCacheClear(inst); } }
  else if (t.dataset.m) S.cfg.mit[t.dataset.m].on = t.checked;
  else if (t.dataset.ma) S.cfg.mit[t.dataset.ma].at = +t.value;
  else if (t.dataset.md) S.cfg.mit[t.dataset.md].dur = +t.value;
  else if (t.id === 'cmpM') { S.cmp = t.value; drawLabChart(); }
  else if (t.id === 'runName') runName = t.value;
}
function evCacheClear(inst) { evCache.delete(inst); }
$('#labLib').addEventListener('click', labClick); $('#labMain').addEventListener('click', labClick);
$('#labMain').addEventListener('input', labInput); $('#labMain').addEventListener('change', labInput);

/* ---------- custom scenarios (builder + import/export) ---------- */
function saveCustom() { try { localStorage.setItem('airspace.custom', JSON.stringify(Object.values(SCEN).filter(s => s.custom).map(({ id, name, cat, blurb, start, dur, restore, staticEvents }) => ({ id, name, cat, blurb, start, dur, restore, staticEvents })))); } catch (e) { } }
function regCustom(d) { const id = d.id && !SCEN[d.id] ? d.id : 'custom_' + (S.uid++); return reg({ id, name: d.name || 'Custom scenario', cat: 'Custom', blurb: d.blurb || 'User-defined scenario.', start: d.start ?? 30, dur: d.dur ?? 60, restore: d.restore ?? 20, params: [], staticEvents: d.staticEvents || [], custom: true }); }
try { JSON.parse(localStorage.getItem('airspace.custom') || '[]').forEach(regCustom); } catch (e) { }
const EFF_TYPES = { src: 'Source outage', wx: 'Weather', rwy: 'Runway closed', cap: 'Capacity multiplier', taxi: 'Taxiway blockage' };
function effRow(type, v = {}) {
  const opt = (arr, sel) => arr.map(o => `<option${o === sel ? ' selected' : ''}>${o}</option>`).join('');
  let a = '', b = '', c = '';
  if (type === 'src') { a = `<select data-e="a">${FACILITIES.map(f => `<option value="${f.id}"${f.id === (v.fac || FOC + '_TWR') ? ' selected' : ''}>${f.name}</option>`).join('')}</select>`; b = `<select data-e="b">${SRCS.map(s => `<option value="${s}"${s === (v.src || 'VOICE') ? ' selected' : ''}>${SRC_LABEL[s]}</option>`).join('')}</select>`; c = `<select data-e="c">${opt(['lost', 'degraded'], v.st)}</select>`; }
  if (type === 'wx') { a = `<select data-e="a">${AIRPORTS.map(x => `<option${x.id === (v.ap || FOC) ? ' selected' : ''}>${x.id}</option>`).join('')}</select>`; b = `<select data-e="b">${opt(Object.keys(WX_LOSS), v.type)}</select>`; c = `<input type="range" data-e="c" min="0.1" max="1" step="0.05" value="${v.sev ?? 0.7}">`; }
  if (type === 'rwy') { a = `<select data-e="a">${opt(RWY, v.rwy)}</select>`; }
  if (type === 'cap') { a = `<select data-e="a">${AIRPORTS.map(x => `<option${x.id === (v.ap || FOC) ? ' selected' : ''}>${x.id}</option>`).join('')}</select>`; c = `<input type="range" data-e="c" min="0.1" max="1" step="0.05" value="${v.m ?? 0.6}">`; }
  if (type === 'taxi') { a = `<select data-e="a">${opt(TWYS.map(t => t.id), v.id)}</select>`; }
  return `<div class="effrow" data-type="${type}"><span style="font-size:11.5px">${EFF_TYPES[type]}</span>${a || '<span></span>'}${b || '<span></span>'}<input type="number" data-e="at" min="0" placeholder="at" title="Offset (min) from scenario start" value="${v.at ?? 0}" style="width:70px"><input type="number" data-e="len" min="1" placeholder="len" title="Length (min); blank = until scenario ends" value="${v.len ?? ''}" style="width:70px"><button class="btn sm dng" data-x="1">✕</button>${c ? `<div style="grid-column:2/7">${c}</div>` : ''}</div>`;
}
function openBuilder() {
  const m = $('#modal'); m.classList.add('on');
  m.innerHTML = `<div class="box"><div class="row sb"><h2>New custom scenario</h2><button class="btn sm" data-close="1">Close</button></div><div class="note">Combine effects to describe a scenario. Offsets are minutes after the scenario starts; leave length blank to apply until it ends.</div>
  <div class="field"><label>Name</label><input id="cbName" placeholder="e.g. Tower evacuation"></div><div class="field"><label>Description</label><input id="cbDesc" placeholder="One line on what happens"></div>
  <div class="row" style="gap:14px"><div class="field"><label>Default start (min)</label><input type="number" id="cbStart" value="30"></div><div class="field"><label>Default duration</label><input type="number" id="cbDur" value="60"></div><div class="field"><label>Restoration</label><input type="number" id="cbRest" value="20"></div></div>
  <h3>Effects</h3><div id="cbEff">${effRow('src')}</div><div class="row" style="margin:8px 0 14px;flex-wrap:wrap">${Object.entries(EFF_TYPES).map(([k, l]) => `<button class="btn sm" data-add-eff="${k}">+ ${l}</button>`).join('')}</div>
  <div class="row"><button class="btn pri" id="cbSave">Save to library</button></div></div>`;
}
function openIO(txt) {
  const m = $('#modal'); m.classList.add('on'); const cur = txt || JSON.stringify(Object.values(SCEN).filter(s => s.custom).map(({ id, name, blurb, start, dur, restore, staticEvents }) => ({ id, name, blurb, start, dur, restore, staticEvents })), null, 1);
  m.innerHTML = `<div class="box"><div class="row sb"><h2>Import / export scenarios</h2><button class="btn sm" data-close="1">Close</button></div><div class="note">Custom scenarios as JSON. Copy this to share with teammates, or paste a JSON array here and import.</div><textarea id="ioText">${esc(cur)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="ioCopy">Copy</button><button class="btn pri" id="ioImport">Import pasted JSON</button></div></div>`;
}
$('#modal').addEventListener('click', e => {
  const t = e.target;
  if (t === $('#modal') || t.closest('[data-close]')) { $('#modal').classList.remove('on'); return; }
  const add = t.closest('[data-add-eff]'); if (add) { $('#cbEff').insertAdjacentHTML('beforeend', effRow(add.dataset.addEff)); return; }
  if (t.closest('[data-x]')) { t.closest('.effrow').remove(); return; }
  if (t.id === 'cbSave') {
    const evs = $$('#cbEff .effrow').map(r => { const g = k => { const el = $(`[data-e="${k}"]`, r); return el ? el.value : null; }, ty = r.dataset.type, o = { k: ty, at: +g('at') || 0 }; const ln = g('len'); if (ln) o.len = +ln;
      if (ty === 'src') Object.assign(o, { fac: g('a'), src: g('b'), st: g('c') }); if (ty === 'wx') Object.assign(o, { ap: g('a'), type: g('b'), sev: +g('c') }); if (ty === 'rwy') Object.assign(o, { ap: FOC, rwy: g('a') }); if (ty === 'cap') Object.assign(o, { ap: g('a'), m: +g('c') }); if (ty === 'taxi') Object.assign(o, { id: g('a') }); return o; });
    if (!evs.length) { toast('Add at least one effect'); return; }
    regCustom({ name: $('#cbName').value.trim() || 'Custom scenario', blurb: $('#cbDesc').value.trim(), start: +$('#cbStart').value, dur: +$('#cbDur').value, restore: +$('#cbRest').value, staticEvents: evs });
    saveCustom(); $('#modal').classList.remove('on'); renderLab(); toast('Scenario saved to library');
  }
  if (t.id === 'ioCopy') { const v = $('#ioText').value; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Copied'), () => { $('#ioText').select(); toast('Press Ctrl/Cmd+C to copy'); }); }
  if (t.id === 'ioImport') { try { let d = JSON.parse($('#ioText').value); if (!Array.isArray(d)) d = [d]; d.forEach(x => { if (x.staticEvents) regCustom({ ...x, id: null }); }); saveCustom(); $('#modal').classList.remove('on'); renderLab(); toast('Imported ' + d.length + ' scenario(s)'); } catch (err) { toast('Could not read JSON'); } }
});

/* ---------- guide ---------- */
$('#guide').onclick = () => { const m = $('#modal'); m.classList.add('on'); m.innerHTML = `<div class="box"><div class="row sb"><h2>AeroFlo — how it works</h2><button class="btn sm" data-close="1">Close</button></div>
  <p class="muted" style="margin:8px 0 12px">A human-supervised decision-support and training tool for air traffic control teams, centered on JFK, LGA and EWR (switch the focus airport in the sidebar or at the top). It organizes information, flags developing problems and lets teams rehearse disruptions. It never issues clearances, directs aircraft or activates procedures.</p>
  <div class="list" style="gap:8px;font-size:12.5px">
  <div><b>Network</b> — synthetic nationwide traffic across 30 airports and 20 ARTCC regions. Click an airport; watch how a problem at the focus airport ripples through aircraft rotations to connecting airports.</div>
  <div><b>Surface</b> — runway configuration and utilization, taxiway congestion, departure queues and arrival flow.</div>
  <div><b>What-If Lab</b> — stack hypothetical failures, test advisory responses, run them against the same traffic and compare. Add or import your own scenarios any time.</div>
  <div><b>Degraded Ops</b> — which sources and capabilities remain, a human task board with owners, and restoration tracking.</div>
  <div><b>Weather layer</b> — faint rain and snow, clouds, moving winds aloft, storm cells, a cold-front line, crosswind arrows and rings on airports with poor flying weather (Network view, Layers; the Surface view lists runway crosswinds). Click an airport for its conditions. Weather scenarios from the Lab strengthen it. Synthetic, not a real forecast.</div>
  <div><b>Alerts &amp; Checks</b> — every alert explains its trigger, sources and uncertainty; instruction-vs-observed checks flag inconsistencies. Decisions are logged for human review.</div></div>
  <div class="row" style="margin-top:14px;gap:6px;flex-wrap:wrap">${tag('PUBLIC')}${tag('SYNTHETIC')}${tag('ESTIMATED')}${tag('SIMULATED')}<span class="muted" style="font-size:11.5px">every panel labels what kind of data it shows. Drag the timeline to scrub; the scenario windows are shaded.</span></div></div>`; };

/* ---------- focus airport (JFK / LGA / EWR) ---------- */
function setFocus(id) {
  if (!AIRFIELD[id] || id === FOC) return;
  applyAirfield(id); S.sel = id; S.pick = null; S.runs = []; S.cfg = newCfg(); S.applied = newCfg(); S.selTaxi = null; S.cmpSeed = 0;
  const b = runHeadless(newCfg(), HORIZON, SEED); S.runs.push({ id: 0, name: 'Baseline (no scenario)', color: RUN_COLORS[0], cfg: newCfg(), result: b.result, series: b.series });
  newSim(S.cfg); $$('#focsw button').forEach(x => x.classList.toggle('on', x.dataset.f === id)); labCat = 'All';
  refreshPanels(true); if (S.view === 'lab') renderLab(); toast('Focus airport: ' + id);
  tellParent({ type: 'airspace-zip-focus-changed', id });
}
$('#focsw').onclick = e => { const b = e.target.closest('button'); if (b) setFocus(b.dataset.f); };

/* ---------- init ---------- */
(function init() {
  resize();
  // baseline reference run (no scenario) — used for "expected" values and comparisons
  const b = runHeadless(newCfg(), HORIZON, SEED);
  S.runs.push({ id: 0, name: 'Baseline (no scenario)', color: RUN_COLORS[0], cfg: newCfg(), result: b.result, series: b.series });
  newSim(newCfg());
  if (PREVIEW_MODE) {
    seek(120);
    const area = freeArea();
    cam.x = lon2x(-74.0);
    cam.y = lat2y(40.7);
    cam.s = Math.min(area.w / 5.4, area.h / 3.4);
  } else fitUS();
  const h = location.hash.slice(1); if (['net', 'sfc', 'lab', 'deg', 'alr'].includes(h)) setView(h); else refreshPanels(true);
  requestAnimationFrame(frame);
  window.__S = S;
})();

/* Same-origin bridge for parent map focus. Traffic and scenario playback stay in
   the original ZIP simulation engine, preserving its full synthetic network. */
addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== parent) return;
  if (event.data?.type === 'airspace-zip-scenario-proposal') {
    const { requestId, proposal } = event.data;
    const rejectProposal = () => parent.postMessage({ type: 'airspace-zip-proposal-result', requestId, status: 'error' }, location.origin);
    if (new URLSearchParams(location.search).get('mode') !== 'simulation' || S.view !== 'lab'
      || typeof requestId !== 'string' || requestId.length > 100 || !proposal || typeof proposal !== 'object') {
      rejectProposal(); return;
    }
    if (S.aiProposalRequests.has(requestId)) {
      parent.postMessage({ type: 'airspace-zip-proposal-result', requestId, status: 'loaded' }, location.origin);
      return;
    }
    const locationId = String(proposal.locationId || '').toUpperCase();
    const eventType = String(proposal.eventType || '');
    const duration = Math.round(Number(proposal.durationMinutes));
    const aircraftCount = Math.round(Number(proposal.syntheticAircraftCount));
    if (!AP[locationId] || !['runway_closure', 'weather_delay', 'traffic_surge', 'generic_disruption'].includes(eventType)
      || !Number.isInteger(duration) || duration < 5 || duration > 240
      || !Number.isInteger(aircraftCount) || aircraftCount < 1 || aircraftCount > 40) {
      rejectProposal(); return;
    }
    const start = Math.max(0, Math.min(HORIZON - duration, Math.floor(Number(proposal.startMinute) || 0)));
    const description = String(proposal.description || 'AI-prepared hypothetical scenario.').slice(0, 220);
    let staticEvents, modelNote;
    if (eventType === 'runway_closure' && locationId === FOC) {
      const runway = RWY.includes('13R/31L') ? '13R/31L' : RWY[0];
      staticEvents = [{ k: 'rwy', ap: FOC, rwy: runway }];
      modelNote = `Assumption: runway ${runway} is used as the closure example.`;
    } else if (eventType === 'weather_delay') {
      staticEvents = [{ k: 'wx', ap: locationId, type: 'Thunderstorms', sev: 0.65 }];
      modelNote = 'Weather impact is represented by the model’s synthetic thunderstorm capacity effect.';
    } else if (eventType === 'traffic_surge') {
      staticEvents = [{ k: 'cap', ap: locationId, m: 0.82 }];
      modelNote = 'The ZIP model keeps a fixed traffic volume, so a traffic surge is approximated as an 18% airport capacity stress; it does not add aircraft.';
    } else if (eventType === 'runway_closure') {
      staticEvents = [{ k: 'cap', ap: locationId, m: 0.7 }];
      modelNote = `The model has runway-specific closure effects only for the focus airport (${FOC}); this other-airport closure is approximated as a 30% capacity reduction.`;
    } else {
      staticEvents = [{ k: 'cap', ap: locationId, m: 0.65 }];
      modelNote = 'Generic disruption is represented as a 35% airport capacity reduction.';
    }
    const scenarioId = `ai_${Date.now()}_${S.uid++}`;
    const scenarioName = `AI proposal · ${locationId} ${eventType.replaceAll('_', ' ')}`;
    reg({
      id: scenarioId, name: scenarioName, cat: 'AI proposal', start, dur: duration, restore: 0,
      blurb: `${description} Assistant request: ${aircraftCount} synthetic-aircraft focus. This model applies effects to its full fixed synthetic network. ${modelNote}`,
      params: [], staticEvents, custom: true,
    });
    S.cfg.stack.push(mkInst(scenarioId, { start, dur: duration, restore: 0 }));
    S.aiProposalRequests.add(requestId);
    renderLab();
    parent.postMessage({ type: 'airspace-zip-proposal-result', requestId, status: 'loaded' }, location.origin);
    return;
  }
  if (event.data?.type === 'airspace-zip-view' && ['net', 'sfc', 'lab', 'deg', 'alr'].includes(event.data.view)) {
    setView(event.data.view);
    return;
  }
  if (event.data?.type === 'airspace-zip-set-focus') {
    if (['JFK', 'LGA', 'EWR'].includes(event.data.id)) setFocus(event.data.id);
    else tellParent({ type: 'airspace-zip-focus-changed', id: FOC });
    return;
  }
  if (event.data?.type === 'airspace-zip-reset') {
    resetToStart();
    return;
  }
  if (event.data?.type === 'airspace-zip-guide') {
    $('#guide').click();
    return;
  }
  if (event.data?.type === 'airspace-zip-preview-zoom') {
    if (PREVIEW_MODE && Number.isFinite(event.data.factor) && event.data.factor >= 0.5 && event.data.factor <= 2) zoomBy(event.data.factor);
    return;
  }
  if (event.data?.type === 'airspace-zip-select') {
    const hit = LASTHIT.find(item => `zip2d-${item.f.id}` === event.data.id);
    if (hit) { setView('net'); S.pick = hit.f; refreshPanels(true); }
    return;
  }
  if (event.data?.type === 'airspace-zip-focus-aircraft') {
    const hit = LASTHIT.find(item => `zip2d-${item.f.id}` === event.data.id);
    if (hit) { setView('net'); S.pick = hit.f; cam.x = hit.p[0]; cam.y = hit.p[1]; cam.s = Math.max(cam.s, 45); refreshPanels(true); }
    return;
  }
  if (event.data?.type !== 'airspace-zip-focus') return;
  const id = String(event.data.id || '');
  if (AP[id]) {
    S.sel = id;
    focusAp(id);
    refreshPanels(true);
  } else if (Number.isFinite(event.data.longitude) && Number.isFinite(event.data.latitude)) {
    cam.x = lon2x(event.data.longitude);
    cam.y = lat2y(event.data.latitude);
    cam.s = Math.max(cam.s, 40);
  }
});

if (new URLSearchParams(location.search).get('mode') === 'demo') {
  document.body.classList.add('portal-demo');
  $('#scenChip').textContent = 'SYNTHETIC TRAFFIC DEMO';
}

/* Publish a bounded, synthetic-only snapshot to the same-origin portal AI. */
const zipMode = new URLSearchParams(location.search).get('mode');
if (zipMode === 'demo' || zipMode === 'simulation') {
  const rad = Math.PI / 180;
  const fromWorld = ([x, y]) => ({ latitude: 50 - y, longitude: x / COSLAT - 125 });
  const trackBetween = (a, b) => {
    const lat1 = a.lat * rad, lat2 = b.lat * rad, dLon = (b.lon - a.lon) * rad;
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (Math.atan2(y, x) / rad + 360) % 360;
  };
  const makeSnapshot = () => {
    const sim = S.sim;
    if (!sim || !Array.isArray(LASTHIT)) return;
    const aircraft = LASTHIT.slice(0, 60).map(hit => {
      const f = hit.f, point = fromWorld(hit.p), origin = AP[f.from || f.o], destination = AP[f.d];
      const groundSpeedMs = origin && destination && Number.isFinite(f.dur) && f.dur > 0
        ? distNm(origin, destination) * 1852 / (f.dur * 60)
        : null;
      return {
        id: `zip2d-${f.id}`,
        callsign: f.cs || null,
        latitude: point.latitude,
        longitude: point.longitude,
        altitudeM: null,
        groundSpeedMs,
        trackDeg: origin && destination ? trackBetween(origin, destination) : null,
        status: f.st,
        originAirport: origin?.id ?? null,
        destinationAirport: destination?.id ?? null,
        source: 'AeroFlo ZIP 2D synthetic model',
        positionKind: 'synthetic_demo',
      };
    });
    const activeScenario = S.applied.stack.map(item => ({
      id: item.sid,
      name: SCEN[item.sid]?.name || item.sid,
      startMinute: item.start,
      durationMinutes: item.dur,
      restorationMinutes: item.restore,
    }));
    parent.postMessage({
      type: 'airspace-zip-snapshot',
      source: 'AeroFlo ZIP 2D synthetic model',
      dataKind: 'synthetic_model',
      mode: zipMode,
      mapView: S.view,
      selectedAirport: S.sel,
      currentMinute: sim.t + Math.min(0.999, S.acc),
      activeScenario,
      visibleCount: LASTHIT.length,
      returnedCount: sim.tails.length,
      positionedCount: LASTHIT.length,
      aircraft,
      altitudeAvailability: 'not modeled by the ZIP simulation engine',
      assumptions: [
        'Aircraft schedules, callsigns, and routes are generated deterministically by the ZIP simulation model.',
        'Enroute map positions interpolate linearly between modeled airport coordinates.',
        'Ground speed is estimated from modeled route distance and simulated leg duration.',
        'Altitude is not included in this model.',
      ],
    }, location.origin);
  };
  setInterval(makeSnapshot, 1000);
}
</script>
